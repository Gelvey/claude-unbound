# Branch protection: require every status check this workflow reports, for example:
#   Ban type ignore suppressions
#   ruff-format (ubuntu-latest), ruff-format (macos-latest)
#   ruff-check (ubuntu-latest), ruff-check (macos-latest)
#   ty (ubuntu-latest), ty (macos-latest)
#   pytest (ubuntu-latest), pytest (macos-latest)
# GitHub may prefix with the workflow name (e.g. "CI / ruff-format (ubuntu-latest)");
# use the names the branch protection UI offers after a run.

name: CI

# Least-privilege default for the runner token; overrides default broader
# repo-token permissions especially during workflow_dispatch reruns.
permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-type-ignore-suppressions:
    name: Ban type ignore suppressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 1

      - name: "Fail on type: ignore (no suppressions allowed)"
        run: |
          if grep -rE '# type: ignore|# ty: ignore' --include='*.py' . --exclude-dir=.venv --exclude-dir=.git; then
            echo "::error::type: ignore / ty: ignore comments are not allowed. Fix the underlying type errors instead."
            exit 1
          fi
          exit 0

  quality:
    name: ${{ matrix.check.id }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        check:
          - id: ruff-format
            run: uv run ruff format --check
          - id: ruff-check
            run: uv run ruff check
          - id: ty
            run: uv run ty check
          - id: pytest
            run: uv run pytest -v --tb=short
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.15"
          enable-cache: true
          cache-python: true

      - name: Run
        run: ${{ matrix.check.run }}

  live-smoke:
    name: Live smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # Opt-in: only runs when FCC_LIVE_SMOKE=1 is set at workflow dispatch or
    # via repository variable. Never runs in normal push/PR CI.
    if: github.event_name == 'workflow_dispatch' && vars.FCC_LIVE_SMOKE == '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.15"
          enable-cache: true
          cache-python: true

      - name: Run live smoke tests
        env:
          FCC_LIVE_SMOKE: "1"
        run: uv run pytest smoke/ -m live -v --tb=short

  admin-build:
    name: admin-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 1

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build admin UI
        run: npm ci && npm run build

      - name: Verify committed artefacts are fresh
        run: git diff --exit-code api/admin_static/
